name: Appium iOS

on:
  schedule:
    - cron: '0 22 * * *' # Runs daily at 10pm UTC
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test:
    name: Run Appium on IOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Appium & XCUITest driver
        run: |
          npm install -g appium
          # --yes suppresses any interactive "do you want to install?" prompts
          # which would suspend the process (SIGTSTP) in a non-interactive CI shell
          appium driver install xcuitest --yes

      - name: Start Appium server
        run: |
          appium --log appium.log &
          # Poll /status instead of sleeping a fixed time.
          # Appium signals readiness via {"ready":true} — fail loudly if it never comes up.
          echo "Waiting for Appium to be ready..."
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4723/status | grep -q '"ready":true'; then
              echo "Appium ready after ~$((i * 3))s"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "ERROR: Appium did not start within 60s. Log:"
              cat appium.log
              exit 1
            fi
            sleep 3
          done

      - name: Boot iOS Simulator
        timeout-minutes: 10 # Hard cap — prevents an infinite hang if simctl stalls
        run: |
          echo "=== Available iPhone simulators ==="
          xcrun simctl list devices available | grep "iPhone"

          # Walk down the preference list until we find a device.
          SIMULATOR_LINE=$(xcrun simctl list devices available | grep "iPhone 16 Pro" | grep -v "Max\|Plus" | head -1)
          if [ -z "$SIMULATOR_LINE" ]; then
            SIMULATOR_LINE=$(xcrun simctl list devices available | grep "iPhone 16" | head -1)
          fi
          if [ -z "$SIMULATOR_LINE" ]; then
            SIMULATOR_LINE=$(xcrun simctl list devices available | grep "iPhone 15" | head -1)
          fi
          if [ -z "$SIMULATOR_LINE" ]; then
            SIMULATOR_LINE=$(xcrun simctl list devices available | grep "iPhone" | head -1)
          fi

          if [ -z "$SIMULATOR_LINE" ]; then
            echo "ERROR: No iPhone simulator found on this runner."
            exit 1
          fi

          # Use a strict UUID pattern (case-insensitive) instead of the previous
          # bracket-based regex which could silently produce an empty UDID.
          UDID=$(echo "$SIMULATOR_LINE" | grep -oEi '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          DEVICE_NAME=$(echo "$SIMULATOR_LINE" | sed 's/ (.*$//' | sed 's/^[[:space:]]*//')

          if [ -z "$UDID" ]; then
            echo "ERROR: Could not extract UDID from: $SIMULATOR_LINE"
            exit 1
          fi

          echo "Booting: $DEVICE_NAME  UDID=$UDID"
          echo "SIMULATOR_UDID=$UDID"     >> "$GITHUB_ENV"
          echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID" || true  # 'Already booted' is not an error
          xcrun simctl bootstatus "$UDID" -b # Blocks until fully booted

      - name: Set app path
        run: |
          # wdiodemoapp 2.app is not tracked in git (untracked locally).
          # iOS-Simulator-NativeDemoApp-0.2.1.app IS committed and is the correct
          # simulator build to use in CI.
          APP="${GITHUB_WORKSPACE}/Apps/iOS-Simulator-NativeDemoApp-0.2.1.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: App bundle not found at $APP"
            ls "${GITHUB_WORKSPACE}/Apps/"
            exit 1
          fi
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Build & run tests
        run: mvn test -DsuiteXmlFile=testng.xml
        env:
          # DriverManager.getConfig() reads these env vars first, so the
          # hardcoded local values in config.properties are never used in CI.
          SIMULATOR_UDID: ${{ env.SIMULATOR_UDID }}
          DEVICE_NAME:    ${{ env.DEVICE_NAME }}
          APP_PATH:       ${{ env.APP_PATH }}
          APPIUM_URL:     http://127.0.0.1:4723

      - name: Upload Appium logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs
          path: appium.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore # suppress the warning when tests never ran

name: Appium iOS CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run iOS Appium Tests
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node.js (required for Appium)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Appium & XCUITest driver
        run: |
          npm install -g appium
          appium driver install xcuitest

      - name: Start Appium server
        run: |
          appium --log appium.log &
          sleep 5

      - name: Boot iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE '\([-A-F0-9]+\)' | tr -d '()')
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build & run tests
        run: mvn test -DsuiteXmlFile=testng.xml
        env:
          SIMULATOR_UDID: ${{ env.SIMULATOR_UDID }}

      - name: Upload Appium logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs
          path: appium.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
